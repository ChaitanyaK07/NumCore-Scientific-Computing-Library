[build-system]
requires = [
    "scikit-build-core>=0.8",
    "pybind11>=2.11",
    "cmake>=3.15",
    "ninja"
]
build-backend = "scikit_build_core.build"

[project]
name = "numcore-scicomp"
version = "0.1.3"
description = "A C++17 scientific computing library with Python bindings for linear algebra, ODE solving, and optimization."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chaitanya Kastury" }
]
keywords = [
    "scientific-computing",
    "numerical-methods",
    "linear-algebra",
    "ode",
    "optimization",
    "cpp",
    "pybind11"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy>=1.21"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
    "cibuildwheel"
]

[project.urls]
Homepage = "https://github.com/ChaitanyaK07/NumCore-Scientific-Computing-Library"
Repository = "https://github.com/ChaitanyaK07/NumCore-Scientific-Computing-Library"
Issues = "https://github.com/ChaitanyaK07/NumCore-Scientific-Computing-Library/issues"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/numcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]